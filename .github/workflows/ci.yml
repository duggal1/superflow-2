name: Swift verification

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.4 compiler
        run: |
          swift --version
          swift --version | grep -Eq 'Swift version 6\.4([. ]|$)'
      - name: Install required lint dependency
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          command -v rg
      - name: Verify packages, tests, and architecture rules
        run: make verify
